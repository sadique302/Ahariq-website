<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ahariq-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f0fdf4" stop-opacity="0.85" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#059669" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="#09090B" />
  
  <!-- Outer Glow Accent Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#ahariq-grad)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Shield Shape -->
  <path d="M256 96 C330 96 384 120 384 120 V260 C384 340 320 400 256 428 C192 400 128 340 128 260 V120 C128 120 182 96 256 96 Z"
        fill="url(#ahariq-grad)" filter="url(#glow)" />

  <!-- Inner Shield Detail -->
  <path d="M256 124 C310 124 352 142 352 142 V254 C352 318 304 366 256 392 C208 366 160 318 160 254 V142 C160 142 202 124 256 124 Z"
        fill="#09090B" />

  <!-- Checkmark / Leaf of Purity -->
  <path d="M216 264 L244 292 L308 220" 
        fill="none" stroke="url(#ahariq-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Small Wheat / Leaf Accent -->
  <circle cx="256" cy="180" r="14" fill="#34D399" />
  <circle cx="216" cy="200" r="10" fill="#10B981" />
  <circle cx="296" cy="200" r="10" fill="#10B981" />
</svg>
